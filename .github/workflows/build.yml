name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.NET 8 WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build app
        run: dotnet build windows/Clothesline.csproj -c Release

      - name: Unit tests
        run: dotnet test windows/tests/Xitu.Tests/Xitu.Tests.csproj -c Release --logger "console;verbosity=normal"

      # 没有 Windows 机器也能看 Windows 版长什么样：每个主题画一张挂着示例图的绳子
      - name: Render theme previews
        shell: pwsh
        run: |
          $exe = "windows/bin/Release/net8.0-windows/Xitu.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--render-themes", "$PWD/theme-previews" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "渲染超时" }
          Get-Content "$env:LOCALAPPDATA/Xitu/log.txt" -ErrorAction SilentlyContinue
          $n = (Get-ChildItem theme-previews -Filter *.png).Count
          Write-Host "预览 $n 张"
          if ($n -eq 0) { Write-Error "没有生成预览" }
          if (Select-String -Path "$env:LOCALAPPDATA/Xitu/log.txt" -Pattern " ERROR " -Quiet) { Write-Error "运行日志里有 ERROR" }

      - uses: actions/upload-artifact@v4
        with:
          name: theme-previews
          path: theme-previews/*.png
          retention-days: 14

      - name: Build icon tool
        run: dotnet build windows/tools/make-icon/MakeIcon.csproj -c Release

      - name: Publish single file
        run: dotnet publish windows/Clothesline.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: xitu-win-x64
          path: publish/
          retention-days: 14

  python:
    name: Linux helper (Python tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile xitu_helper.py
        run: python -m py_compile linux/xitu_helper.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 助手的单测，以及 shared/tests 里和 Windows 共用的用例（layout.js 的函数用 node 跑）
      - name: Unit tests
        run: |
          python -m pip install --quiet pytest pillow
          python -m pytest -q linux/tests

  # 没人能在真机上点 Linux 版：在 Arch 容器里起无头 Sway，真的跑 qs -p linux，
  # 用 ipc + 虚拟鼠标/键盘把主要功能走一遍，每步截图；日志里有 QML 警告/错误就失败。
  linux-ui:
    name: Linux UI (headless Sway + Quickshell)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    permissions:
      contents: write   # 截图推到 ui-shots/* 分支，在网页上直接看
    steps:
      - name: Install packages
        run: |
          pacman -Syu --noconfirm --needed quickshell sway grim slurp wl-clipboard \
            inotify-tools python python-pillow wqy-microhei ttf-dejavu git libcap \
            swaybg adwaita-cursors mesa foot
          # Arch 的 sway 带 cap_sys_nice 文件能力，容器里 exec 会被拒（EPERM），去掉
          setcap -r /usr/bin/sway || true
          qs --version || true

      - uses: actions/checkout@v4

      - name: Drive the UI
        run: python linux/tests/ui/drive.py --out ui-shots

      # 截图推到单独的分支（每次覆盖），GitHub 网页上打开就能看，不用下载 zip
      - name: Publish screenshots to a branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        shell: bash
        run: |
          [ -d ui-shots ] || exit 0
          if [ -n "$PR" ]; then br="ui-shots/pr-$PR"; else br="ui-shots/${GITHUB_REF_NAME//\//-}"; fi
          cd ui-shots
          git init -q -b "$br"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Linux UI screenshots for $GITHUB_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$br"
          echo "截图：https://github.com/${GITHUB_REPOSITORY}/tree/$br" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ui-shots
          path: ui-shots/
          retention-days: 14

  # Sway 之外的桌面：niri（嵌在无头 Sway 里）和 KDE 的 KWin（--virtual 无头）
  linux-desktops:
    name: Linux UI (${{ matrix.desktop }})
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        desktop: [niri, kwin]
    steps:
      - name: Install packages
        run: |
          common="quickshell foot wl-clipboard inotify-tools python python-pillow wqy-microhei ttf-dejavu mesa adwaita-cursors libcap grim"
          if [ "${{ matrix.desktop }}" = niri ]; then extra="niri sway swaybg"; else extra="kwin dbus"; fi
          pacman -Syu --noconfirm --needed $common $extra
          # 同 linux-ui：Arch 的 sway / kwin 带文件能力，容器里 exec 会被拒
          setcap -r /usr/bin/sway 2>/dev/null || true
          setcap -r /usr/bin/kwin_wayland 2>/dev/null || true
          qs --version || true

      - uses: actions/checkout@v4

      - name: Drive the UI
        run: python linux/tests/ui/desktops.py ${{ matrix.desktop }} --out ui-desktop-${{ matrix.desktop }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ui-${{ matrix.desktop }}
          path: ui-desktop-${{ matrix.desktop }}/
          retention-days: 14
