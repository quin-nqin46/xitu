name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.NET 8 WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build app
        run: dotnet build windows/Clothesline.csproj -c Release

      - name: Unit tests
        run: dotnet test windows/tests/Xitu.Tests/Xitu.Tests.csproj -c Release --logger "console;verbosity=normal"

      # 没有 Windows 机器也能看 Windows 版长什么样：每个主题画一张挂着示例图的绳子
      - name: Render theme previews
        shell: pwsh
        run: |
          $exe = "windows/bin/Release/net8.0-windows/Xitu.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--render-themes", "$PWD/theme-previews" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "渲染超时" }
          Get-Content "$env:LOCALAPPDATA/Xitu/log.txt" -ErrorAction SilentlyContinue
          $n = (Get-ChildItem theme-previews -Filter *.png).Count
          Write-Host "预览 $n 张"
          if ($n -eq 0) { Write-Error "没有生成预览" }
          if (Select-String -Path "$env:LOCALAPPDATA/Xitu/log.txt" -Pattern " ERROR " -Quiet) { Write-Error "运行日志里有 ERROR" }

      - uses: actions/upload-artifact@v4
        with:
          name: theme-previews
          path: theme-previews/*.png
          retention-days: 14

      - name: Build icon tool
        run: dotnet build windows/tools/make-icon/MakeIcon.csproj -c Release

      - name: Publish single file
        run: dotnet publish windows/Clothesline.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: xitu-win-x64
          path: publish/
          retention-days: 14

  python:
    name: Linux helper (Python syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile xitu_helper.py
        run: python -m py_compile linux/xitu_helper.py
