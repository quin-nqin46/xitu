name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.NET 8 WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build app
        run: dotnet build windows/Clothesline.csproj -c Release

      - name: Build icon tool
        run: dotnet build windows/tools/make-icon/MakeIcon.csproj -c Release

      - name: Publish single file
        run: dotnet publish windows/Clothesline.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: xitu-win-x64
          path: publish/
          retention-days: 14

  python:
    name: Linux helper (Python syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile xitu_helper.py
        run: python -m py_compile linux/xitu_helper.py
